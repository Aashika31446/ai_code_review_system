[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
    "F401",  # module imported but unused
    "F841",  # local variable assigned but unused
    "E722",  # bare except (in test files)
    "E711",  # comparison to None (in test files)
]
exclude = [
    "test_files",
    "tests",
    "alembic",
    ".git",
    "__pycache__",
    "uploads",
]
