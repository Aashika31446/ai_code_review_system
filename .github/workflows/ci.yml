name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # 1. Backend Pytest Job
  # ============================================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend:${{ github.workspace }}/code-analyzer:${{ github.workspace }}/ai-engine
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key-for-continuous-integration-pipeline-12345
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      AI_PROVIDER: gemini
      GEMINI_API_KEY: mock-ci-gemini-key
      OPENAI_API_KEY: mock-ci-openai-key
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          if [ -f code-analyzer/requirements.txt ]; then
            pip install -r code-analyzer/requirements.txt
          fi
          if [ -f ai-engine/requirements.txt ]; then
            pip install -r ai-engine/requirements.txt
          fi
          pip install pytest httpx

      - name: Run backend tests
        run: |
          pytest tests/ -v

  # ============================================================================
  # 2. Frontend Build Job
  # ============================================================================
  test-frontend:
    name: Test Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run frontend build
        run: |
          npm run build

  # ============================================================================
  # 3. Backend & Engine Linting Job
  # ============================================================================
  lint-backend:
    name: Lint Backend & Engines
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ensure target directories exist
        run: |
          mkdir -p backend code-analyzer ai-engine

      - name: Run Ruff check
        run: |
          ruff check backend/ code-analyzer/ ai-engine/
