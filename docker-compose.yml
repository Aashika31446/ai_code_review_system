version: "3.8"

services:
  # ============================================================================
  # 1. Database Service (PostgreSQL 15)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: code_review_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-code_review_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-code_review_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # ============================================================================
  # 2. Backend Service (FastAPI)
  # ============================================================================
  backend:
    container_name: code_review_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-code_review_db}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ============================================================================
  # 3. Frontend Service (React + Vite)
  # ============================================================================
  frontend:
    container_name: code_review_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - app-network

# ==============================================================================
# Networks & Volumes Configuration
# ==============================================================================
networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data
    driver: local
  uploads:
    name: uploads
    driver: local
